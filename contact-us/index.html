<!doctype html>
<html lang="en" class="sl-root">
  <head class="sl-head">
    <meta charset="UTF-8" class="sl-meta-charset" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" class="sl-meta-viewport" />
    <meta
      class="sl-meta-description"
      name="description"
      content="Contact SideLine with questions, feedback, or support requests."
    />
    <title class="sl-title">Contact Us | SideLine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" class="sl-preconnect-google" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin class="sl-preconnect-gstatic" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Oswald:wght@200;300;400;500;600;700&family=Space+Mono&display=block"
      class="sl-fonts"
    />
    <link rel="stylesheet" href="/styles.css" class="sl-stylesheet" />
  </head>
  <body class="sl-body sl-contact-page">
    <header id="sl-header" class="site-header sl-header" aria-label="Primary navigation">
      <div class="sl-header-inner">
        <a id="sl-brand-link" class="brand sl-brand" href="/" aria-label="SideLine home">
          <img class="sl-brand-logo" src="/screenshots/Sideline%20Logo.png" alt="" width="449" height="95" />
        </a>
      </div>
    </header>

    <main id="top" class="sl-main sl-contact-page-main">
      <div class="sl-contact-page-container">
        <div class="sl-contact-page-panel" id="sl-contact-page">
          <div class="sl-contact-page-form-view" id="sl-contact-page-form-view">
            <h1 class="sl-contact-modal-title" id="sl-contact-page-title">Contact Us</h1>
            <form class="sl-contact-form" id="sl-contact-form" novalidate>
              <div class="sl-contact-field">
                <label class="sl-contact-label" for="sl-contact-name">Name <span class="sl-contact-required">*</span></label>
                <input
                  class="sl-contact-input"
                  type="text"
                  id="sl-contact-name"
                  name="name"
                  autocomplete="name"
                  required
                />
              </div>
              <div class="sl-contact-field">
                <label class="sl-contact-label" for="sl-contact-email">Email <span class="sl-contact-required">*</span></label>
                <input
                  class="sl-contact-input"
                  type="email"
                  id="sl-contact-email"
                  name="email"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="sl-contact-field">
                <label class="sl-contact-label" for="sl-contact-subject">Subject</label>
                <input
                  class="sl-contact-input"
                  type="text"
                  id="sl-contact-subject"
                  name="subject"
                  autocomplete="off"
                />
              </div>
              <div class="sl-contact-field">
                <label class="sl-contact-label" for="sl-contact-message">Message <span class="sl-contact-required">*</span></label>
                <textarea
                  class="sl-contact-textarea"
                  id="sl-contact-message"
                  name="message"
                  rows="5"
                  required
                ></textarea>
              </div>
              <p class="sl-contact-error" id="sl-contact-error" hidden></p>
              <button type="submit" class="sl-contact-submit" id="sl-contact-submit">Submit</button>
            </form>
          </div>
          <div class="sl-contact-page-success-view" id="sl-contact-page-success-view" hidden>
            <p class="sl-contact-success-message" id="sl-contact-page-success-message"></p>
            <button type="button" class="sl-contact-submit" id="sl-contact-page-reset">Send another message</button>
          </div>
        </div>
      </div>
    </main>

    <footer id="sl-site-footer" class="site-footer sl-footer sl-site-footer sl-section" data-section>
      <a class="brand sl-brand sl-footer-brand" href="/" aria-label="SideLine home">
        <img class="sl-brand-logo" src="/screenshots/Sideline%20Logo.png" alt="" width="449" height="95" />
      </a>
      <nav class="sl-footer-nav" aria-label="Footer">
        <a class="sl-footer-link is-current" id="sl-footer-contact" href="/contact-us">Contact Us</a>
        <a class="sl-footer-link" id="sl-footer-privacy" href="/privacy">Privacy Policy</a>
        <a class="sl-footer-link" id="sl-footer-terms" href="/terms-of-service">Terms of Use</a>
      </nav>
      <p class="sl-footer-social-label">Follow Us</p>
      <div class="sl-footer-social" aria-label="Social media">
        <a class="sl-footer-social-link sl-footer-social-x" href="https://x.com/TheSidelineClub" aria-label="Follow SideLine on X">
          <svg class="sl-footer-social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
          </svg>
        </a>
        <a class="sl-footer-social-link sl-footer-social-instagram" href="https://www.instagram.com/thesideline_club/" aria-label="Follow SideLine on Instagram">
          <svg class="sl-footer-social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z" />
          </svg>
        </a>
        <a class="sl-footer-social-link sl-footer-social-linkedin" href="https://www.linkedin.com/company/thesideline/posts/" aria-label="Follow SideLine on LinkedIn">
          <svg class="sl-footer-social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.119 20.452H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
          </svg>
        </a>
      </div>
      <p class="sl-footer-copyright">© 2026 Sideline Sports Inc. All rights reserved.</p>
      <p class="sl-footer-disclaimer">
        Third-party names, trademarks and imagery are used solely for identification and editorial purposes. Their use does not imply endorsement or affiliation with Sideline.
      </p>
    </footer>

    <script src="/contact-modal.js"></script>
  </body>
</html>
