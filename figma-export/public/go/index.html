<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Sideline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    main { text-align: center; padding: 24px; max-width: 32rem; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    p { margin: 0 0 24px; font-size: 1.125rem; }
    a {
      display: inline-block;
      background: #e10600;
      color: #fff;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="club"></h1>
    <p id="supporters"></p>
    <a id="open" href="myapp://go">Open in Sideline</a>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("club").textContent = params.get("club") || "";
    document.getElementById("supporters").textContent = params.get("supporters") || "";
    const path = location.pathname.replace(/^\/+/, "").replace(/\/+$/, "");
    document.getElementById("open").href = "myapp://" + path + location.search;
  </script>
</body>
</html>
