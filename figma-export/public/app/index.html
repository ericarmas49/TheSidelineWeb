    <title>Download Sideline</title>
    <script>
      (function redirectToStore() {
        var appStoreUrl = "https://apps.apple.com/us/app/sideline-club/id6789336406";
        var googlePlayUrl = "https://play.google.com/store/apps/details?id=com.thesidelineapp.app&hl=en_US";
        var userAgent = navigator.userAgent || navigator.vendor || window.opera || "";
        var isAndroid = /android/i.test(userAgent);
        window.location.replace(isAndroid ? googlePlayUrl : appStoreUrl);
      })();
    </script>
